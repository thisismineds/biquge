name: qingyue
description: A quiet Chinese novel reader with selectable sources.
publish_to: none
version: 2.0.8+10

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.9.0
  html: ^0.15.6
  encrypt: ^5.0.3
  shared_preferences: ^2.5.3
  characters: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - images/
