plugins {
    id 'com.android.application'
    id 'dev.flutter.flutter-gradle-plugin'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}
def debugKeystore = System.getenv('QINGYUE_DEBUG_KEYSTORE')
def offlineTtsDir = file('offline-tts')
def offlineTtsAar = new File(offlineTtsDir, 'sherpa-onnx-static-link-onnxruntime-2.0.1.aar')
def offlineTtsAssets = new File(offlineTtsDir, 'library-assets')

android {
    namespace 'com.example.qingyue'
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion
    sourceSets.main.assets.srcDir(offlineTtsAssets)

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId 'com.example.qingyue'
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        debug {
            if (debugKeystore) {
                storeFile file(debugKeystore)
            }
        }
        if (keystoreProperties['storeFile']) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Test upgrades must explicitly opt into the existing debug identity.
            if (debugKeystore) {
                signingConfig signingConfigs.debug
            } else if (keystoreProperties['storeFile']) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation files(offlineTtsAar)
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.0'
}

tasks.named('preBuild').configure {
    doFirst {
        def voice = new File(offlineTtsAssets, 'tts/kokoro-int8-multi-lang-v1_1')
        def requiredVoiceFiles = ['model.int8.onnx', 'voices.bin', 'tokens.txt', 'lexicon-us-en.txt', 'lexicon-zh.txt', 'phone-zh.fst', 'date-zh.fst', 'number-zh.fst', 'LICENSE']
        if (!offlineTtsAar.isFile() || requiredVoiceFiles.any { !new File(voice, it).isFile() }) {
            throw new GradleException('Offline library or Kokoro model is missing. Run tool/prepare_offline_voice.ps1 from the repository.')
        }
    }
}

flutter {
    source '../..'
}
